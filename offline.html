<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIEMPRE HULIDE - Hors ligne</title>  <!-- Ajout nom -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2196F3 0%, #764ba2 100%); /* <-- theme_color du manifest */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
        }
        .icon {
            font-size: 100px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .brand {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        button {
            background: white;
            color: #2196F3; /* <-- theme_color du manifest */
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s;
        }
        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛍️</div>  <!-- Changé pour shopping -->
        <div class="brand">SIEMPRE HULIDE</div> <!-- Ajout nom -->
        <h1>Vous êtes hors ligne</h1>
        <p>Pas de panique ! Revenez quand vous aurez internet pour découvrir nos Bijoux, Chaussures et Chapeaux.</p>
        <button onclick="window.location.reload()">
            🔄 Réessayer
        </button>
    </div>
</body>
</html>
